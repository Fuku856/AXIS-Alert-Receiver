name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable
      run: |
        pyinstaller --noconfirm --onedir --windowed --hidden-import=win32crypt --add-data "icon.png;." --icon "icon.png" --name "AXIS-Alert-Receiver" main.py

    - name: Create Zip Archive
      run: |
        # コミット時のrun_numberを使ってバージョンを生成（例: v1.0.12）
        $VERSION = "v1.0.${{ github.run_number }}"
        $PACKAGE_NAME = "AXIS-Alert-Receiver_${VERSION}"
        
        # フォルダ名を指定の形式に変更
        Rename-Item -Path "dist\AXIS-Alert-Receiver" -NewName $PACKAGE_NAME
        
        # ZIPファイルを作成
        Compress-Archive -Path "dist\${PACKAGE_NAME}" -DestinationPath "${PACKAGE_NAME}.zip"
        
        # 後のステップで使うために環境変数にセット
        echo "PACKAGE_NAME=$PACKAGE_NAME" >> $env:GITHUB_ENV
        echo "VERSION=$VERSION" >> $env:GITHUB_ENV

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION }}
        name: ${{ env.VERSION }}
        files: ${{ env.PACKAGE_NAME }}.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
