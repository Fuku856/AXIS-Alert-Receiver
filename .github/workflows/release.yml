name: Build and Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Inject Version into config.py
      run: |
        $VERSION = "${{ github.event.release.tag_name }}"
        $VERSION = $VERSION.TrimStart('v')
        (Get-Content config.py) -replace 'APP_VERSION = ".*"', "APP_VERSION = `"$VERSION`"" | Set-Content config.py

    - name: Build executable
      run: |
        pyinstaller --noconfirm --onedir --windowed --hidden-import=win32crypt --add-data "icon.ico;." --icon "icon.ico" --name "AXIS-Alert-Receiver" main.py

    - name: Create Portable Zip
      run: |
        # release tag name is available in github.event.release.tag_name
        $VERSION = "${{ github.event.release.tag_name }}"
        $PACKAGE_NAME = "AXIS-Alert-Receiver_portable_${VERSION}"
        
        # フォルダ名を指定の形式に変更
        Rename-Item -Path "dist\AXIS-Alert-Receiver" -NewName $PACKAGE_NAME
        
        # ZIPファイルを作成
        Compress-Archive -Path "dist\${PACKAGE_NAME}" -DestinationPath "${PACKAGE_NAME}.zip"
        
        # 後のステップで使うために環境変数にセット
        echo "PACKAGE_NAME=$PACKAGE_NAME" >> $env:GITHUB_ENV
        echo "VERSION=$VERSION" >> $env:GITHUB_ENV

    - name: Build Installer
      run: |
        # ISCC (Inno Setup Compiler) is pre-installed on windows-latest runner
        iscc.exe "/DMyAppVersion=${{ env.VERSION }}" "/DMySourceDir=dist\${{ env.PACKAGE_NAME }}" installer.iss

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ env.PACKAGE_NAME }}.zip
          Output/AXIS-Alert-Receiver_Setup_${{ env.VERSION }}.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
